<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foodle — dónde comer según los foodies</title>
    <meta name="description" content="Foodle agrega los restaurantes recomendados por foodies de YouTube en un buscador filtrable por ciudad, cocina y precio." />
    <style>
      :root {
        --bg: #14100e; --bg-soft: #1d1714; --bg-card: #221b17; --bg-elev: #2a221d;
        --border: #362c25; --border-soft: #2c241f;
        --text: #f6ede5; --text-dim: #b6a99e; --text-faint: #7d7167;
        --accent: #ff5a3c; --accent-hover: #ff7559; --accent-soft: rgba(255,90,60,0.13);
        --gold: #f2b705; --radius: 15px; --radius-sm: 10px;
        --shadow: 0 8px 28px rgba(0,0,0,0.5); --maxw: 1200px;
        --display: "Arial Black","Helvetica Neue",Impact,system-ui,sans-serif;
        --body: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
      a { color: inherit; text-decoration: none; }
      button { font-family: inherit; cursor: pointer; }
      [hidden] { display: none !important; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .logo { font-family: var(--display); font-weight: 900; letter-spacing: -1.5px; color: var(--text); line-height: 1; }
      .logo .dot { color: var(--accent); }

      .home { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px 90px; text-align: center; background: radial-gradient(900px 460px at 50% 30%, rgba(255,90,60,0.16), transparent 65%), var(--bg); }
      .home .logo { font-size: clamp(56px,12vw,96px); margin-bottom: 6px; }
      .home .tagline { color: var(--text-dim); font-size: clamp(14px,2.6vw,18px); margin-bottom: 34px; }
      .home .tagline b { color: var(--text); font-weight: 600; }
      .home-search { position: relative; width: 100%; max-width: 600px; }
      .home-search input { width: 100%; padding: 19px 56px 19px 24px; font-size: 17px; color: var(--text); background: var(--bg-elev); border: 1.5px solid var(--border); border-radius: 999px; outline: none; transition: border-color .15s, box-shadow .15s; }
      .home-search input::placeholder { color: var(--text-faint); }
      .home-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
      .home-search .icon { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 21px; pointer-events: none; }
      .home-actions { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 22px; width: 100%; }
      .shortcuts-label { color: var(--text-faint); font-size: 12px; text-transform: uppercase; letter-spacing: 1.4px; display: flex; align-items: center; gap: 7px; }
      .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; max-width: 600px; }
      .chip { padding: 9px 16px; font-size: 14px; border-radius: 999px; background: var(--bg-soft); border: 1px solid var(--border); color: var(--text-dim); transition: all .14s; }
      .chip:hover { color: var(--accent-hover); border-color: var(--accent); background: var(--accent-soft); }

      .topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 18px; padding: 12px 20px; background: rgba(20,16,14,.93); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-soft); }
      .topbar .logo { font-size: 26px; cursor: pointer; flex-shrink: 0; }
      .topbar-search { position: relative; flex: 1; max-width: 620px; }
      .topbar-search input { width: 100%; padding: 11px 44px 11px 18px; font-size: 15px; color: var(--text); background: var(--bg-elev); border: 1px solid var(--border); border-radius: 999px; outline: none; }
      .topbar-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .topbar-search .icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--accent); pointer-events: none; }

      .layout { max-width: var(--maxw); margin: 0 auto; padding: 24px 20px 64px; display: grid; grid-template-columns: 250px 1fr; gap: 26px; align-items: start; }
      aside.filters { position: sticky; top: 74px; background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 20px 18px; }
      .filters h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-faint); margin: 0 0 16px; font-weight: 700; }
      .fgroup { margin-bottom: 18px; }
      .fgroup > label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 7px; font-weight: 600; }
      .filters select { width: 100%; padding: 10px 12px; background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; outline: none; }
      .filters select:focus { border-color: var(--accent); }
      .pill-row { display: flex; flex-wrap: wrap; gap: 7px; }
      .pill { padding: 7px 12px; font-size: 13px; border-radius: 999px; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim); user-select: none; }
      .pill.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-hover); }
      .btn-clear { width: 100%; margin-top: 4px; padding: 11px; background: transparent; color: var(--text-dim); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; transition: all .15s; }
      .btn-clear:hover { color: var(--text); border-color: var(--text-faint); }

      .results-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
      .results-count { font-size: 14px; color: var(--text-dim); }
      .results-count strong { color: var(--text); }
      .sort-wrap { display: flex; align-items: center; gap: 8px; }
      .sort-wrap label { font-size: 13px; color: var(--text-faint); }
      .sort-wrap select { padding: 8px 12px; background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; outline: none; }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px,1fr)); gap: 18px; }
      .card { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform .12s, border-color .12s, box-shadow .12s; }
      .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
      .card .photo { position: relative; aspect-ratio: 16/9; overflow: hidden; display: flex; align-items: center; justify-content: center; }
      .card .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; z-index: 1; }
      .card .photo .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 50px; z-index: 0; }
      .card .photo .nivel { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; backdrop-filter: blur(4px); }
      .nivel.top { background: rgba(242,183,5,.92); color: #2a1d00; }
      .nivel.rec { background: rgba(76,175,80,.9); color: #06210a; }
      .nivel.mix { background: rgba(120,120,120,.85); color: #fff; }
      .nivel.ver { background: rgba(255,90,60,.9); color: #2a0a04; }
      .card .photo .city { position: absolute; bottom: 10px; left: 12px; font-size: 12px; font-weight: 600; color: #fff; background: rgba(0,0,0,.55); padding: 3px 9px; border-radius: 999px; backdrop-filter: blur(3px); }
      .card .body { padding: 14px 15px 15px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
      .card .name { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.25; }
      .card .sub { font-size: 12.5px; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 6px; }
      .card .sub span:not(:last-child)::after { content: "·"; margin-left: 6px; color: var(--text-faint); }
      .card .verdict { font-size: 13.5px; color: var(--text); background: var(--bg-elev); border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 0 8px 8px 0; font-style: italic; }
      .card .chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim); }
      .tag.warn { color: #ffb38a; border-color: rgba(255,120,60,.4); }
      .tag.good { color: #9be29b; border-color: rgba(76,175,80,.35); }
      .tag.publi { color: #2a1d00; background: var(--gold); border-color: var(--gold); font-weight: 700; }
      .card .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; }
      .card .creator { font-size: 11.5px; color: var(--text-faint); display: flex; align-items: center; gap: 6px; }
      .card .creator .av { width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg,var(--accent),var(--gold)); }
      .card .watch { font-size: 12.5px; font-weight: 600; color: var(--accent-hover); }
      .card:hover .watch { text-decoration: underline; }

      /* Mi Ruta */
      .ruta-btn { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 9px 14px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 999px; color: var(--text); font-size: 13px; font-weight: 600; }
      .ruta-btn:hover { border-color: var(--accent); }
      .ruta-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-hover); }
      .ruta-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #1a0e04; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
      .heart { position: absolute; top: 10px; left: 10px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); color: #fff; font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .1s; }
      .heart:hover { transform: scale(1.12); }
      .heart.on { background: var(--accent); }
      .card.visitado { opacity: 0.62; }
      .card.visitado .name { text-decoration: line-through; }
      .ciudad-bloque { margin-bottom: 28px; }
      .ciudad-bloque h3 { font-size: 16px; color: var(--text); margin: 0 0 4px; }
      .ciudad-bloque .prog { font-size: 12.5px; color: var(--text-faint); margin-bottom: 12px; }
      .ruta-controls { display: flex; gap: 8px; padding-top: 6px; }
      .ruta-controls button { flex: 1; padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-dim); font-size: 12.5px; font-weight: 600; cursor: pointer; }
      .ruta-controls .visit.done { background: rgba(76,175,80,.9); color: #06210a; border-color: transparent; }
      .ruta-controls .visit:hover { border-color: #4caf50; }
      .ruta-controls .quitar:hover { border-color: var(--accent); color: var(--accent-hover); }
      .ruta-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
      .ruta-head h2 { margin: 0; font-size: 22px; }
      .btn-volver { padding: 8px 14px; background: transparent; border: 1px solid var(--border); border-radius: 999px; color: var(--text-dim); font-size: 13px; }
      .btn-volver:hover { color: var(--text); border-color: var(--text-faint); }

      .state { text-align: center; padding: 70px 20px; color: var(--text-dim); }
      .state .big { font-size: 46px; margin-bottom: 14px; }
      .state h3 { color: var(--text); font-size: 19px; margin: 0 0 8px; }
      .state p { margin: 0 auto; max-width: 440px; font-size: 14px; color: var(--text-faint); }
      .state code { background: var(--bg-elev); padding: 2px 7px; border-radius: 6px; color: var(--accent-hover); font-size: 13px; }
      .loadmore-wrap { display: flex; justify-content: center; margin-top: 30px; }
      .btn-loadmore { padding: 13px 30px; background: var(--accent); color: #1a0e04; border: none; border-radius: 999px; font-size: 14px; font-weight: 700; }
      .btn-loadmore:hover { background: var(--accent-hover); }

      footer { text-align: center; padding: 26px 20px; color: var(--text-faint); font-size: 12.5px; }
      .app footer { border-top: 1px solid var(--border-soft); }
      .mobile-filter-toggle { display: none; width: 100%; padding: 12px; margin-bottom: 16px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; font-weight: 600; }
      @media (max-width: 820px) {
        .layout { grid-template-columns: 1fr; }
        .mobile-filter-toggle { display: block; }
        aside.filters { position: static; display: none; }
        aside.filters.open { display: block; }
        .topbar .logo { font-size: 22px; }
      }
    </style>
  </head>
  <body>
    <!-- ════════ PORTADA ════════ -->
    <section class="home" id="home">
      <div class="logo">food<span class="dot">l</span>e</div>
      <div class="tagline">dónde comer según los <b>foodies</b> en los que confías</div>
      <form class="home-search" id="home-form" autocomplete="off">
        <input id="q-home" type="text" placeholder="Busca restaurante, ciudad o tipo de comida…" aria-label="Buscar" />
        <span class="icon">⌕</span>
      </form>
      <div class="home-actions">
        <span class="shortcuts-label">🔥 Ciudades</span>
        <div class="chips" id="city-chips"></div>
      </div>
    </section>

    <!-- ════════ RESULTADOS ════════ -->
    <div class="app" id="app" hidden>
      <header class="topbar">
        <div class="logo" id="logo-home" title="Inicio">food<span class="dot">l</span>e</div>
        <form class="topbar-search" id="top-form" autocomplete="off">
          <input id="q" type="text" placeholder="Buscar restaurante, ciudad o comida…" aria-label="Buscar" />
          <span class="icon">⌕</span>
        </form>
        <button class="ruta-btn" id="rutaBtn" title="Mi ruta">🗺️ Mi Ruta <span class="ruta-count" id="rutaCount">0</span></button>
      </header>
      <main class="layout">
        <button class="mobile-filter-toggle" id="filterToggle">⚙︎ Filtros</button>
        <aside class="filters" id="filters">
          <h2>Filtros</h2>
          <div class="fgroup"><label for="f-ciudad">Ciudad</label><select id="f-ciudad"><option value="">Todas</option></select></div>
          <div class="fgroup"><label for="f-cocina">Tipo de cocina</label><select id="f-cocina"><option value="">Todas</option></select></div>
          <div class="fgroup">
            <label>Veredicto</label>
            <div class="pill-row" id="f-nivel">
              <span class="pill" data-n="top">🔥 Top</span>
              <span class="pill" data-n="rec">👍 Recomendado</span>
              <span class="pill" data-n="mix">😐 Mixto</span>
            </div>
          </div>
          <div class="fgroup"><label for="f-creador">Recomendado por</label><select id="f-creador"><option value="">Todos los foodies</option></select></div>
          <button class="btn-clear" id="clearFilters">Limpiar filtros</button>
        </aside>
        <section class="results">
          <div class="results-head">
            <div class="results-count" id="count">—</div>
            <div class="sort-wrap">
              <label for="sort">Ordenar:</label>
              <select id="sort">
                <option value="relevancia">Mejor valorados</option>
                <option value="recientes">Más recientes</option>
                <option value="nombre">Nombre (A-Z)</option>
              </select>
            </div>
          </div>
          <div class="grid" id="grid"></div>
          <div id="state-slot"></div>
          <div class="loadmore-wrap" id="loadmore-wrap" style="display:none"><button class="btn-loadmore" id="loadmore">Cargar más</button></div>
        </section>
      </main>
      <footer>Foodle · restaurantes recomendados por foodies de YouTube · enlazamos siempre al vídeo original</footer>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getFirestore, collection, query, where, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      /* ════════════════════════════════════════════════════════════════
       *  CONFIG — la config de tu app web de Firebase vive en un archivo
       *  aparte: firebase-config.js (que git ignora, para no chocar al
       *  actualizar). Copia firebase-config.example.js → firebase-config.js
       *  y pega ahí tus datos. Se carga abajo, en init().
       * ════════════════════════════════════════════════════════════════ */
      let firebaseConfig = null;

      const FETCH_LIMIT = 1000;
      const PAGE_SIZE = 24;

      const NIVEL_LABEL = { top: "🔥 Top", rec: "👍 Recomendado", mix: "😐 Mixto", ver: "⏳ Por descubrir" };
      const NIVEL_ORDER = { top: 0, rec: 1, ver: 2, mix: 3 };
      const COCINA_EMOJI = {
        Arroces: "🥘", Marisco: "🦐", Carnes: "🥩", Asador: "🔥", Tapas: "🍤",
        Tradicional: "🍲", Asturiana: "🧀", Gallega: "🐙", Extremeña: "🐖",
        "Alta cocina": "⭐", Italiana: "🍝", Hamburguesas: "🍔", Dulce: "🧁",
        Bocadillos: "🥪", "Sin gluten": "🌾", Internacional: "🍱", Fusión: "🍽️", Catalana: "🍲",
      };
      const GRAD = [["#3a2a05","#1d1714"],["#0e2a12","#1d1714"],["#3a1505","#1d1714"],["#2a2520","#1d1714"],["#0a2520","#1d1714"]];

      let TODOS = [], FILTRADOS = [], visibles = PAGE_SIZE;
      const niveles = new Set();

      /* ───────── Mi Ruta (localStorage, sin registro) ───────── */
      let ruta = {};
      try { ruta = JSON.parse(localStorage.getItem("foodle_ruta") || "{}"); } catch (_) { ruta = {}; }
      let modoRuta = false;
      const enRuta = (id) => !!ruta[id];
      function guardarRuta() {
        localStorage.setItem("foodle_ruta", JSON.stringify(ruta));
        const n = Object.keys(ruta).length;
        const c = document.getElementById("rutaCount");
        if (c) c.textContent = n;
      }
      function toggleRuta(r) {
        if (!r || !r.id) return;
        if (ruta[r.id]) delete ruta[r.id];
        else ruta[r.id] = { id: r.id, nombre: r.nombre, ciudad: r.ciudad, zona: r.zona, cocina: r.cocina, precio: r.precio, nivel: r.nivel, veredicto: r.veredicto, tags: r.tags, creador: r.creador, url: r.url, vid: r.vid, imagen: r.imagen, visited: false };
        guardarRuta();
        if (modoRuta) renderRuta(); else render();
      }
      // Llamada desde los botones inline de las cards.
      window.__ruta = (accion, id) => {
        if (accion === "toggle") {
          const r = TODOS.find((x) => x.id === id) || ruta[id];
          toggleRuta(r);
        } else if (accion === "visited") {
          if (ruta[id]) { ruta[id].visited = !ruta[id].visited; guardarRuta(); renderRuta(); }
        } else if (accion === "remove") {
          delete ruta[id]; guardarRuta(); renderRuta();
        }
      };

      // Cascada de miniaturas: si una falla (404), prueba la siguiente; si se
      // acaban, quita el <img> y queda el degradado + emoji de respaldo.
      window.__ytfb = (img) => {
        const v = img.dataset.vid;
        const steps = (img.dataset.steps || "").split(",").filter(Boolean);
        if (v && steps.length) {
          const next = steps.shift();
          img.dataset.steps = steps.join(",");
          img.src = `https://i.ytimg.com/vi/${v}/${next}`;
        } else {
          img.remove();
        }
      };
      const $ = (id) => document.getElementById(id);
      const grid = $("grid"), stateSlot = $("state-slot");
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
      const emojiDe = (c) => COCINA_EMOJI[c] || "🍽️";

      function showState(emoji, titulo, html) {
        grid.innerHTML = "";
        stateSlot.innerHTML = `<div class="state"><div class="big">${emoji}</div><h3>${titulo}</h3><p>${html}</p></div>`;
      }

      function irAResultados(q) { $("q").value = q || ""; $("home").hidden = true; $("app").hidden = false; window.scrollTo(0,0); aplicar(); if (!q) $("q").focus(); }
      function irAInicio() { $("app").hidden = true; $("home").hidden = false; $("q-home").value = ""; }
      $("home-form").addEventListener("submit", (e) => { e.preventDefault(); irAResultados($("q-home").value.trim()); });
      $("top-form").addEventListener("submit", (e) => { e.preventDefault(); aplicar(); });
      $("logo-home").addEventListener("click", irAInicio);

      function cardHTML(r, i) {
        const nivel = r.nivel || "rec";
        const g = GRAD[i % GRAD.length];
        const sub = [r.cocina, r.zona, r.precio].filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join("");
        const chips = (r.tags || []).map((t) => {
          const cls = t.startsWith("⚠️") ? "warn" : (t.startsWith("📣") ? "publi" : (/pet/i.test(t) ? "good" : ""));
          return `<span class="tag ${cls}">${esc(t)}</span>`;
        }).join("");
        const ph = `<div class="ph" style="background:linear-gradient(135deg,${g[0]},${g[1]})">${emojiDe(r.cocina)}</div>`;
        // Saca el id del vídeo de vid / imagen / url, lo que haya.
        const vid = r.vid
          || (r.imagen && (r.imagen.match(/\/vi\/([^/]+)\//) || [])[1])
          || (r.url && (r.url.match(/youtu\.be\/([^?&]+)/) || [])[1])
          || null;
        // Probamos varios tamaños de miniatura en cascada antes de rendirnos.
        const img = vid
          ? `${ph}<img src="https://i.ytimg.com/vi/${esc(vid)}/hqdefault.jpg" alt="${esc(r.nombre)}" loading="lazy" data-vid="${esc(vid)}" data-steps="mqdefault.jpg,0.jpg,1.jpg" onerror="window.__ytfb(this)" />`
          : ph;
        const fav = enRuta(r.id);
        return `<a class="card ${ruta[r.id] && ruta[r.id].visited ? "visitado" : ""}" href="${esc(r.url || "#")}" target="_blank" rel="noopener noreferrer">
          <div class="photo">${img}
            <button class="heart ${fav ? "on" : ""}" title="${fav ? "Quitar de mi ruta" : "Añadir a mi ruta"}" onclick="event.preventDefault();event.stopPropagation();window.__ruta('toggle','${esc(r.id)}')">${fav ? "♥" : "♡"}</button>
            <span class="nivel ${nivel}">${NIVEL_LABEL[nivel] || ""}</span>
            ${r.ciudad ? `<span class="city">📍 ${esc(r.ciudad)}</span>` : ""}
          </div>
          <div class="body">
            <div class="name">${esc(r.nombre)}</div>
            <div class="sub">${sub}</div>
            ${r.veredicto ? `<div class="verdict">“${esc(r.veredicto)}”</div>` : ""}
            ${chips ? `<div class="chips-row">${chips}</div>` : ""}
            <div class="foot">
              <span class="creator"><span class="av"></span> ${esc(r.creador || "")}</span>
              <span class="watch">▶ Ver reseña</span>
            </div>
          </div>
        </a>`;
      }

      function render() {
        const total = FILTRADOS.length;
        $("count").innerHTML = total === 0 ? "Sin resultados" : `<strong>${total}</strong> restaurantes`;
        if (total === 0) { showState("🔍", "No hay sitios con esos filtros", "Prueba a quitar alguno."); $("loadmore-wrap").style.display = "none"; return; }
        stateSlot.innerHTML = "";
        grid.innerHTML = FILTRADOS.slice(0, visibles).map(cardHTML).join("");
        $("loadmore-wrap").style.display = visibles < total ? "flex" : "none";
      }

      function leer() {
        return { texto: $("q").value.trim().toLowerCase(), ciudad: $("f-ciudad").value, cocina: $("f-cocina").value, creador: $("f-creador").value, niveles };
      }
      function pasa(r, f) {
        if (f.ciudad && r.ciudad !== f.ciudad) return false;
        if (f.cocina && r.cocina !== f.cocina) return false;
        if (f.creador && r.creador !== f.creador) return false;
        if (f.niveles.size && !f.niveles.has(r.nivel || "rec")) return false;
        if (f.texto) { const h = [r.nombre, r.ciudad, r.zona, r.cocina, r.veredicto, r.creador].filter(Boolean).join(" ").toLowerCase(); if (!h.includes(f.texto)) return false; }
        return true;
      }
      function ordenar(arr) {
        const m = $("sort").value, c = [...arr];
        if (m === "nombre") c.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es"));
        else if (m === "recientes") c.sort((a, b) => String(b.fecha || "").localeCompare(String(a.fecha || "")));
        else c.sort((a, b) => (NIVEL_ORDER[a.nivel || "rec"] ?? 1) - (NIVEL_ORDER[b.nivel || "rec"] ?? 1));
        return c;
      }
      function aplicar() {
        if (modoRuta) { modoRuta = false; const rb = document.getElementById("rutaBtn"); if (rb) rb.classList.remove("on"); }
        const f = leer(); FILTRADOS = ordenar(TODOS.filter((r) => pasa(r, f))); visibles = PAGE_SIZE; render();
      }

      /* ───────── Vista "Mi Ruta" ───────── */
      function renderRuta() {
        modoRuta = true;
        document.getElementById("rutaBtn").classList.add("on");
        grid.innerHTML = "";
        $("count").innerHTML = "";
        $("loadmore-wrap").style.display = "none";

        const items = Object.values(ruta);
        if (items.length === 0) {
          stateSlot.innerHTML = `<div class="state"><div class="big">🗺️</div><h3>Tu ruta está vacía</h3><p>Pulsa el ♥ en los restaurantes que quieras visitar y se irán añadiendo a tu ruta. Luego los vas tachando según los visitas.</p></div>`;
          return;
        }
        const porCiudad = {};
        items.forEach((r) => { const c = r.ciudad || "Sin ciudad"; (porCiudad[c] = porCiudad[c] || []).push(r); });
        const ciudades = Object.keys(porCiudad).sort((a, b) => a.localeCompare(b, "es"));
        const visitados = items.filter((r) => r.visited).length;

        let html = `<div class="ruta-head"><h2>🗺️ Mi Ruta — ${visitados}/${items.length} visitados</h2><button class="btn-volver" id="volverBtn">← Volver al buscador</button></div>`;
        ciudades.forEach((c) => {
          const list = porCiudad[c];
          const v = list.filter((r) => r.visited).length;
          html += `<div class="ciudad-bloque"><h3>📍 ${esc(c)}</h3><div class="prog">${v}/${list.length} visitados</div><div class="grid">`;
          html += list.map((r, i) => `<div class="ruta-item">${cardHTML(r, i)}<div class="ruta-controls">`
            + `<button class="visit ${r.visited ? "done" : ""}" onclick="window.__ruta('visited','${esc(r.id)}')">${r.visited ? "✓ Visitado" : "Marcar visitado"}</button>`
            + `<button class="quitar" onclick="window.__ruta('remove','${esc(r.id)}')">Quitar</button>`
            + `</div></div>`).join("");
          html += `</div></div>`;
        });
        stateSlot.innerHTML = html;
        const vb = document.getElementById("volverBtn");
        if (vb) vb.onclick = aplicar;
      }

      function poblar() {
        const ciudades = [...new Set(TODOS.map((r) => r.ciudad).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
        const cocinas = [...new Set(TODOS.map((r) => r.cocina).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
        const creadores = [...new Set(TODOS.map((r) => r.creador).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
        const add = (sel, vals) => vals.forEach((v) => { const o = document.createElement("option"); o.value = v; o.textContent = v; $(sel).appendChild(o); });
        add("f-ciudad", ciudades); add("f-cocina", cocinas); add("f-creador", creadores);
        const cc = $("city-chips");
        ciudades.slice(0, 8).forEach((c) => { const b = document.createElement("button"); b.className = "chip"; b.textContent = c; b.onclick = () => irAResultados(c); cc.appendChild(b); });
      }

      ["f-ciudad","f-cocina","f-creador","sort"].forEach((id) => $(id).addEventListener("change", aplicar));
      $("q").addEventListener("input", aplicar);
      $("f-nivel").addEventListener("click", (e) => { const p = e.target.closest(".pill"); if (!p) return; const n = p.dataset.n; niveles.has(n) ? niveles.delete(n) : niveles.add(n); p.classList.toggle("on"); aplicar(); });
      $("clearFilters").addEventListener("click", () => { $("q").value = ""; $("f-ciudad").value = ""; $("f-cocina").value = ""; $("f-creador").value = ""; niveles.clear(); document.querySelectorAll("#f-nivel .pill").forEach((p) => p.classList.remove("on")); $("sort").value = "relevancia"; aplicar(); });
      $("loadmore").addEventListener("click", () => { visibles += PAGE_SIZE; render(); });
      $("filterToggle").addEventListener("click", () => $("filters").classList.toggle("open"));
      $("rutaBtn").addEventListener("click", () => { modoRuta ? aplicar() : renderRuta(); });
      guardarRuta(); // pinta el contador inicial

      async function init() {
        try {
          const m = await import("./firebase-config.js");
          firebaseConfig = m.firebaseConfig;
        } catch (_) { /* archivo ausente → mensaje de config abajo */ }

        if (!firebaseConfig || firebaseConfig.projectId === "TU_PROYECTO") {
          irAResultados("");
          showState("🛠️", "Configura Firebase", 'Crea <code>firebase-config.js</code> (copia <code>firebase-config.example.js</code>) y pega ahí los datos de tu app web de Firebase.');
          return;
        }
        try {
          const app = initializeApp(firebaseConfig);
          const db = getFirestore(app);
          const snap = await getDocs(query(collection(db, "restaurants"), where("activo", "==", true), limit(FETCH_LIMIT)));
          TODOS = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          if (TODOS.length === 0) {
            irAResultados("");
            showState("🍽️", "Aún no hay restaurantes", "Ejecuta <code>node foodle/extract.js @canal --firestore</code> para llenar la base de datos y recarga.");
            return;
          }
          poblar();
        } catch (e) {
          console.error(e);
          irAResultados("");
          showState("⚠️", "Error al cargar", "Revisa la consola del navegador: config de Firebase o reglas de Firestore.");
        }
      }
      init();
    </script>
  </body>
</html>
