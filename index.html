<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mootle — el buscador de motos de segunda mano</title>
    <meta
      name="description"
      content="Mootle agrega anuncios de motos de segunda mano de Milanuncios, Wallapop y Coches.net en un solo buscador."
    />

    <!-- Tipografías: display con personalidad + body legible -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0d0d0d;
        --bg-soft: #161616;
        --bg-card: #1a1a1a;
        --bg-elev: #202020;
        --border: #2a2a2a;
        --border-soft: #232323;
        --text: #f2f2f2;
        --text-dim: #a0a0a0;
        --text-faint: #6b6b6b;
        --accent: #e8670a;
        --accent-hover: #ff7a1a;
        --accent-soft: rgba(232, 103, 10, 0.12);
        --radius: 14px;
        --radius-sm: 10px;
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        --maxw: 1280px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Sora", system-ui, -apple-system, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font-family: inherit;
        cursor: pointer;
      }

      /* ───────────────────────── Header / hero ───────────────────────── */
      header.hero {
        position: relative;
        padding: 28px 20px 26px;
        background: radial-gradient(
            1200px 360px at 50% -120px,
            rgba(232, 103, 10, 0.18),
            transparent 70%
          ),
          var(--bg);
        border-bottom: 1px solid var(--border-soft);
      }

      .hero-inner {
        max-width: var(--maxw);
        margin: 0 auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: center;
        margin-bottom: 18px;
      }

      .brand .logo {
        font-family: "Archivo Black", sans-serif;
        font-size: 30px;
        letter-spacing: -0.5px;
        color: var(--text);
      }

      .brand .logo .dot {
        color: var(--accent);
      }

      .brand .tag {
        font-size: 12px;
        color: var(--text-faint);
        border-left: 1px solid var(--border);
        padding-left: 12px;
        margin-top: 4px;
      }

      /* Barra de búsqueda signature */
      .searchbar {
        position: relative;
        max-width: 680px;
        margin: 0 auto;
      }

      .searchbar input {
        width: 100%;
        padding: 18px 54px 18px 22px;
        font-size: 17px;
        color: var(--text);
        background: var(--bg-elev);
        border: 1.5px solid var(--border);
        border-radius: 999px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      .searchbar input::placeholder {
        color: var(--text-faint);
      }

      .searchbar input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      .searchbar .icon {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--accent);
        font-size: 20px;
        pointer-events: none;
      }

      /* Autocompletado */
      .autocomplete {
        position: absolute;
        z-index: 30;
        left: 0;
        right: 0;
        top: calc(100% + 8px);
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow);
        overflow: hidden;
        display: none;
      }

      .autocomplete.open {
        display: block;
      }

      .autocomplete .opt {
        padding: 11px 18px;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .autocomplete .opt:hover,
      .autocomplete .opt.active {
        background: var(--accent-soft);
        color: var(--accent-hover);
      }

      .autocomplete .opt .count {
        color: var(--text-faint);
        font-size: 12px;
      }

      /* ───────────────────────── Layout ───────────────────────── */
      .layout {
        max-width: var(--maxw);
        margin: 0 auto;
        padding: 24px 20px 64px;
        display: grid;
        grid-template-columns: 268px 1fr;
        gap: 26px;
        align-items: start;
      }

      /* ───────────────────────── Sidebar filtros ───────────────────────── */
      aside.filters {
        position: sticky;
        top: 18px;
        background: var(--bg-soft);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        padding: 20px 18px;
      }

      .filters h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-faint);
        margin: 0 0 16px;
        font-weight: 700;
      }

      .fgroup {
        margin-bottom: 18px;
      }

      .fgroup > label {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 7px;
        font-weight: 600;
      }

      .filters select,
      .filters input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        background: var(--bg-elev);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 14px;
        outline: none;
      }

      .filters select:focus,
      .filters input:focus {
        border-color: var(--accent);
      }

      .range {
        display: flex;
        gap: 8px;
      }

      .range input {
        width: 50%;
      }

      .checks label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--text);
        padding: 5px 0;
        cursor: pointer;
      }

      .checks input[type="checkbox"] {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .pill {
        padding: 7px 12px;
        font-size: 13px;
        border-radius: 999px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        color: var(--text-dim);
        user-select: none;
      }

      .pill.on {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent-hover);
      }

      .btn-clear {
        width: 100%;
        margin-top: 4px;
        padding: 11px;
        background: transparent;
        color: var(--text-dim);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 13px;
        transition: all 0.15s;
      }

      .btn-clear:hover {
        color: var(--text);
        border-color: var(--text-faint);
      }

      /* ───────────────────────── Resultados ───────────────────────── */
      .results-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .results-count {
        font-size: 14px;
        color: var(--text-dim);
      }

      .results-count strong {
        color: var(--text);
      }

      .sort-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .sort-wrap label {
        font-size: 13px;
        color: var(--text-faint);
      }

      .sort-wrap select {
        padding: 8px 12px;
        background: var(--bg-elev);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 13px;
        outline: none;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 16px;
      }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
      }

      .card:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
        box-shadow: var(--shadow);
      }

      .card .photo {
        position: relative;
        aspect-ratio: 4 / 3;
        background: var(--bg-elev)
          linear-gradient(135deg, #1d1d1d, #141414);
        overflow: hidden;
      }

      .card .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card .photo .noimg {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-faint);
        font-size: 36px;
      }

      .badge {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 11px;
        font-weight: 600;
        padding: 4px 9px;
        border-radius: 999px;
        color: #fff;
        backdrop-filter: blur(4px);
        background: rgba(0, 0, 0, 0.55);
      }

      .badge.milanuncios {
        background: rgba(0, 174, 102, 0.9);
      }
      .badge.wallapop {
        background: rgba(19, 193, 172, 0.9);
      }
      .badge.cochesnet {
        background: rgba(230, 70, 30, 0.9);
      }

      .card .body {
        padding: 13px 14px 15px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }

      .card .title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--text);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 2.7em;
      }

      .card .price {
        font-family: "Archivo Black", sans-serif;
        font-size: 22px;
        color: var(--accent);
        letter-spacing: -0.5px;
      }

      .card .meta {
        font-size: 12.5px;
        color: var(--text-dim);
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: auto;
      }

      .card .meta span:not(:last-child)::after {
        content: "·";
        margin-left: 6px;
        color: var(--text-faint);
      }

      /* Estados (vacío / carga / error) */
      .state {
        text-align: center;
        padding: 70px 20px;
        color: var(--text-dim);
      }

      .state .big {
        font-size: 46px;
        margin-bottom: 14px;
      }

      .state h3 {
        color: var(--text);
        font-size: 19px;
        margin: 0 0 8px;
      }

      .state p {
        margin: 0 auto;
        max-width: 420px;
        font-size: 14px;
        color: var(--text-faint);
      }

      .state code {
        background: var(--bg-elev);
        padding: 2px 7px;
        border-radius: 6px;
        color: var(--accent-hover);
        font-size: 13px;
      }

      .loadmore-wrap {
        display: flex;
        justify-content: center;
        margin-top: 30px;
      }

      .btn-loadmore {
        padding: 13px 30px;
        background: var(--accent);
        color: #1a0e04;
        border: none;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        transition: background 0.15s, transform 0.1s;
      }

      .btn-loadmore:hover {
        background: var(--accent-hover);
      }

      .btn-loadmore:active {
        transform: scale(0.98);
      }

      .skeleton {
        background: var(--bg-card);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .skeleton .ph {
        aspect-ratio: 4 / 3;
        background: linear-gradient(
          90deg,
          #1a1a1a 25%,
          #232323 50%,
          #1a1a1a 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.3s infinite;
      }

      .skeleton .ln {
        height: 12px;
        margin: 12px 14px;
        border-radius: 6px;
        background: linear-gradient(
          90deg,
          #1a1a1a 25%,
          #232323 50%,
          #1a1a1a 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.3s infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      footer {
        text-align: center;
        padding: 30px 20px;
        color: var(--text-faint);
        font-size: 12.5px;
        border-top: 1px solid var(--border-soft);
      }

      /* Botón de filtros para móvil */
      .mobile-filter-toggle {
        display: none;
        width: 100%;
        padding: 12px;
        margin-bottom: 16px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
      }

      /* ───────────────────────── Responsive ───────────────────────── */
      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .mobile-filter-toggle {
          display: block;
        }

        aside.filters {
          position: static;
          display: none;
        }

        aside.filters.open {
          display: block;
        }

        .brand .logo {
          font-size: 26px;
        }
      }
    </style>
  </head>

  <body>
    <header class="hero">
      <div class="hero-inner">
        <div class="brand">
          <span class="logo">moot<span class="dot">l</span>e</span>
          <span class="tag">el buscador de motos<br />de segunda mano</span>
        </div>
        <div class="searchbar">
          <input
            id="q"
            type="text"
            autocomplete="off"
            placeholder="Busca por marca o modelo… (ej. Honda CB650, MT-07, Vespa)"
          />
          <span class="icon">⌕</span>
          <div class="autocomplete" id="ac"></div>
        </div>
      </div>
    </header>

    <main class="layout">
      <button class="mobile-filter-toggle" id="filterToggle">
        ⚙︎ Filtros
      </button>

      <aside class="filters" id="filters">
        <h2>Filtros</h2>

        <div class="fgroup">
          <label for="f-marca">Marca</label>
          <select id="f-marca">
            <option value="">Todas</option>
          </select>
        </div>

        <div class="fgroup">
          <label for="f-modelo">Modelo</label>
          <select id="f-modelo">
            <option value="">Todos</option>
          </select>
        </div>

        <div class="fgroup">
          <label>Precio (€)</label>
          <div class="range">
            <input id="f-precio-min" type="number" min="0" placeholder="mín" />
            <input id="f-precio-max" type="number" min="0" placeholder="máx" />
          </div>
        </div>

        <div class="fgroup">
          <label for="f-km-max">Km máximos</label>
          <input id="f-km-max" type="number" min="0" placeholder="ej. 30000" />
        </div>

        <div class="fgroup">
          <label>Año</label>
          <div class="range">
            <input id="f-anio-min" type="number" min="1950" placeholder="desde" />
            <input id="f-anio-max" type="number" min="1950" placeholder="hasta" />
          </div>
        </div>

        <div class="fgroup">
          <label for="f-provincia">Provincia</label>
          <select id="f-provincia">
            <option value="">Todas</option>
          </select>
        </div>

        <div class="fgroup">
          <label>Tipo de moto</label>
          <div class="pill-row" id="f-tipo">
            <span class="pill" data-tipo="naked">Naked</span>
            <span class="pill" data-tipo="trail">Trail</span>
            <span class="pill" data-tipo="deportiva">Deportiva</span>
            <span class="pill" data-tipo="custom">Custom</span>
            <span class="pill" data-tipo="scooter">Scooter</span>
          </div>
        </div>

        <div class="fgroup">
          <label>Portal de origen</label>
          <div class="checks" id="f-portal">
            <label
              ><input type="checkbox" value="milanuncios" checked />
              Milanuncios</label
            >
            <label
              ><input type="checkbox" value="wallapop" checked /> Wallapop</label
            >
            <label
              ><input type="checkbox" value="cochesnet" checked />
              Coches.net</label
            >
          </div>
        </div>

        <button class="btn-clear" id="clearFilters">Limpiar filtros</button>
      </aside>

      <section class="results">
        <div class="results-head">
          <div class="results-count" id="count">Cargando anuncios…</div>
          <div class="sort-wrap">
            <label for="sort">Ordenar:</label>
            <select id="sort">
              <option value="recientes">Más recientes</option>
              <option value="precio-asc">Precio: menor a mayor</option>
              <option value="precio-desc">Precio: mayor a menor</option>
              <option value="km-asc">Km: menos primero</option>
            </select>
          </div>
        </div>

        <div class="grid" id="grid"></div>
        <div id="state-slot"></div>

        <div class="loadmore-wrap" id="loadmore-wrap" style="display: none">
          <button class="btn-loadmore" id="loadmore">Cargar más</button>
        </div>
      </section>
    </main>

    <footer>
      Mootle v0.1 · agrega anuncios públicos de Milanuncios, Wallapop y
      Coches.net · los precios y datos pertenecen a sus portales de origen
    </footer>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getFirestore,
        collection,
        query,
        where,
        orderBy,
        limit,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      /* ════════════════════════════════════════════════════════════════
       *  CONFIGURACIÓN — rellena con la config de tu app web de Firebase
       *  (Firebase Console > Configuración del proyecto > Tus apps > Web).
       * ════════════════════════════════════════════════════════════════ */
      const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "TU_PROYECTO.firebaseapp.com",
        projectId: "TU_PROYECTO",
        storageBucket: "TU_PROYECTO.appspot.com",
        messagingSenderId: "TU_SENDER_ID",
        appId: "TU_APP_ID",
      };

      // Cuántos anuncios traer de Firestore al cargar. El filtrado, orden y
      // paginación se hacen en cliente sobre este conjunto (suficiente para
      // v0.1; al crecer, los filtros pasarán a consultas server-side).
      const FETCH_LIMIT = 500;
      const PAGE_SIZE = 24;

      /* ───────────────────────── estado ───────────────────────── */
      let TODOS = []; // todos los anuncios traídos
      let FILTRADOS = []; // tras aplicar filtros + orden
      let visibles = PAGE_SIZE; // cuántos se muestran ahora

      const $ = (id) => document.getElementById(id);
      const grid = $("grid");
      const stateSlot = $("state-slot");

      const tiposActivos = new Set();

      /* ───────────────────────── helpers UI ───────────────────────── */
      function fmtPrecio(p) {
        if (p === null || p === undefined) return "Consultar";
        return new Intl.NumberFormat("es-ES").format(p) + " €";
      }

      function fmtNum(n) {
        if (n === null || n === undefined) return null;
        return new Intl.NumberFormat("es-ES").format(n);
      }

      function escapeHtml(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c])
        );
      }

      function nombrePortal(id) {
        return (
          { milanuncios: "Milanuncios", wallapop: "Wallapop", cochesnet: "Coches.net" }[
            id
          ] || id
        );
      }

      function tituloAnuncio(a) {
        if (a.titulo) return a.titulo;
        const partes = [a.marca, a.modelo, a.año].filter(Boolean);
        return partes.length ? partes.join(" ") : "Moto de segunda mano";
      }

      function showState(emoji, titulo, html) {
        stateSlot.innerHTML = `<div class="state"><div class="big">${emoji}</div><h3>${titulo}</h3><p>${html}</p></div>`;
      }

      function clearState() {
        stateSlot.innerHTML = "";
      }

      function skeletons(n = 8) {
        grid.innerHTML = Array.from({ length: n })
          .map(
            () =>
              `<div class="skeleton"><div class="ph"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:50%"></div><div class="ln" style="width:65%"></div></div>`
          )
          .join("");
      }

      /* ───────────────────────── render cards ───────────────────────── */
      function cardHTML(a) {
        const foto = Array.isArray(a.fotos) && a.fotos.length ? a.fotos[0] : null;
        const metaParts = [];
        if (a.km !== null && a.km !== undefined)
          metaParts.push(`<span>${fmtNum(a.km)} km</span>`);
        if (a.año) metaParts.push(`<span>${a.año}</span>`);
        if (a.provincia) metaParts.push(`<span>${escapeHtml(a.provincia)}</span>`);

        const photoInner = foto
          ? `<img src="${escapeHtml(
              foto
            )}" alt="${escapeHtml(tituloAnuncio(a))}" loading="lazy"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
             <div class="noimg" style="display:none">🏍️</div>`
          : `<div class="noimg">🏍️</div>`;

        return `<a class="card" href="${escapeHtml(
          a.url_original || "#"
        )}" target="_blank" rel="noopener noreferrer">
          <div class="photo">
            ${photoInner}
            <span class="badge ${escapeHtml(a.portal)}">${escapeHtml(
          nombrePortal(a.portal)
        )}</span>
          </div>
          <div class="body">
            <div class="title">${escapeHtml(tituloAnuncio(a))}</div>
            <div class="price">${fmtPrecio(a.precio)}</div>
            <div class="meta">${metaParts.join("")}</div>
          </div>
        </a>`;
      }

      function render() {
        clearState();
        const total = FILTRADOS.length;
        $("count").innerHTML =
          total === 0
            ? "Sin resultados"
            : `<strong>${fmtNum(total)}</strong> motos encontradas`;

        if (total === 0) {
          grid.innerHTML = "";
          showState(
            "🔍",
            "No hay motos con esos filtros",
            "Prueba a ampliar el rango de precio o quitar algún filtro."
          );
          $("loadmore-wrap").style.display = "none";
          return;
        }

        const slice = FILTRADOS.slice(0, visibles);
        grid.innerHTML = slice.map(cardHTML).join("");
        $("loadmore-wrap").style.display =
          visibles < total ? "flex" : "none";
      }

      /* ───────────────────────── filtros + orden ───────────────────────── */
      function leerFiltros() {
        const portalesOn = new Set(
          [...document.querySelectorAll("#f-portal input:checked")].map(
            (c) => c.value
          )
        );
        return {
          texto: $("q").value.trim().toLowerCase(),
          marca: $("f-marca").value,
          modelo: $("f-modelo").value,
          precioMin: parseFloat($("f-precio-min").value) || null,
          precioMax: parseFloat($("f-precio-max").value) || null,
          kmMax: parseFloat($("f-km-max").value) || null,
          anioMin: parseInt($("f-anio-min").value) || null,
          anioMax: parseInt($("f-anio-max").value) || null,
          provincia: $("f-provincia").value,
          tipos: tiposActivos,
          portales: portalesOn,
        };
      }

      function pasaFiltros(a, f) {
        if (f.marca && a.marca !== f.marca) return false;
        if (f.modelo && a.modelo !== f.modelo) return false;
        if (f.provincia && a.provincia !== f.provincia) return false;
        if (f.precioMin !== null && (a.precio ?? Infinity) < f.precioMin)
          return false;
        if (f.precioMax !== null && (a.precio ?? Infinity) > f.precioMax)
          return false;
        if (f.kmMax !== null && (a.km ?? Infinity) > f.kmMax) return false;
        if (f.anioMin !== null && (a.año ?? 0) < f.anioMin) return false;
        if (f.anioMax !== null && (a.año ?? 9999) > f.anioMax) return false;
        if (f.tipos.size && !f.tipos.has(a.tipo)) return false;
        if (f.portales.size && !f.portales.has(a.portal)) return false;
        if (f.texto) {
          const hay = [a.titulo, a.marca, a.modelo]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();
          if (!hay.includes(f.texto)) return false;
        }
        return true;
      }

      function ordenar(arr) {
        const modo = $("sort").value;
        const c = [...arr];
        const inf = (v, alto) =>
          v === null || v === undefined ? (alto ? Infinity : -Infinity) : v;
        switch (modo) {
          case "precio-asc":
            c.sort((a, b) => inf(a.precio, true) - inf(b.precio, true));
            break;
          case "precio-desc":
            c.sort((a, b) => inf(b.precio, false) - inf(a.precio, false));
            break;
          case "km-asc":
            c.sort((a, b) => inf(a.km, true) - inf(b.km, true));
            break;
          default: // recientes
            c.sort((a, b) =>
              String(b.fecha_crawl || "").localeCompare(String(a.fecha_crawl || ""))
            );
        }
        return c;
      }

      function aplicar() {
        const f = leerFiltros();
        FILTRADOS = ordenar(TODOS.filter((a) => pasaFiltros(a, f)));
        visibles = PAGE_SIZE;
        render();
      }

      /* ───────────────── poblar selects desde los datos ───────────────── */
      function poblarSelects() {
        const marcas = new Map();
        const provincias = new Set();
        for (const a of TODOS) {
          if (a.marca) marcas.set(a.marca, (marcas.get(a.marca) || 0) + 1);
          if (a.provincia) provincias.add(a.provincia);
        }

        const selMarca = $("f-marca");
        [...marcas.keys()]
          .sort((x, y) => x.localeCompare(y, "es"))
          .forEach((m) => {
            const o = document.createElement("option");
            o.value = m;
            o.textContent = `${m} (${marcas.get(m)})`;
            selMarca.appendChild(o);
          });

        const selProv = $("f-provincia");
        [...provincias]
          .sort((x, y) => x.localeCompare(y, "es"))
          .forEach((p) => {
            const o = document.createElement("option");
            o.value = p;
            o.textContent = p;
            selProv.appendChild(o);
          });
      }

      function poblarModelos() {
        const marca = $("f-marca").value;
        const selModelo = $("f-modelo");
        selModelo.innerHTML = '<option value="">Todos</option>';
        if (!marca) {
          selModelo.disabled = true;
          return;
        }
        selModelo.disabled = false;
        const modelos = new Set();
        for (const a of TODOS) {
          if (a.marca === marca && a.modelo) modelos.add(a.modelo);
        }
        [...modelos]
          .sort((x, y) => x.localeCompare(y, "es"))
          .forEach((m) => {
            const o = document.createElement("option");
            o.value = m;
            o.textContent = m;
            selModelo.appendChild(o);
          });
      }

      /* ───────────────────────── autocompletado ───────────────────────── */
      const ac = $("ac");
      let acIndex = -1;
      let acOpts = [];

      function buildAutocomplete() {
        const q = $("q").value.trim().toLowerCase();
        if (q.length < 1) {
          ac.classList.remove("open");
          return;
        }
        const conteo = new Map();
        for (const a of TODOS) {
          for (const cand of [
            a.marca,
            a.marca && a.modelo ? `${a.marca} ${a.modelo}` : null,
          ]) {
            if (cand && cand.toLowerCase().includes(q)) {
              conteo.set(cand, (conteo.get(cand) || 0) + 1);
            }
          }
        }
        acOpts = [...conteo.entries()]
          .sort((a, b) => b[1] - a[1])
          .slice(0, 7);
        if (acOpts.length === 0) {
          ac.classList.remove("open");
          return;
        }
        acIndex = -1;
        ac.innerHTML = acOpts
          .map(
            ([txt, n], i) =>
              `<div class="opt" data-i="${i}"><span>${escapeHtml(
                txt
              )}</span><span class="count">${n}</span></div>`
          )
          .join("");
        ac.classList.add("open");
      }

      ac.addEventListener("click", (e) => {
        const opt = e.target.closest(".opt");
        if (!opt) return;
        $("q").value = acOpts[+opt.dataset.i][0];
        ac.classList.remove("open");
        aplicar();
      });

      /* ───────────────────────── eventos ───────────────────────── */
      let debounce;
      function debounced(fn, ms = 200) {
        clearTimeout(debounce);
        debounce = setTimeout(fn, ms);
      }

      $("q").addEventListener("input", () => {
        buildAutocomplete();
        debounced(aplicar);
      });

      $("q").addEventListener("keydown", (e) => {
        if (!ac.classList.contains("open")) return;
        const opts = [...ac.querySelectorAll(".opt")];
        if (e.key === "ArrowDown") {
          e.preventDefault();
          acIndex = Math.min(acIndex + 1, opts.length - 1);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          acIndex = Math.max(acIndex - 1, 0);
        } else if (e.key === "Enter" && acIndex >= 0) {
          e.preventDefault();
          $("q").value = acOpts[acIndex][0];
          ac.classList.remove("open");
          aplicar();
          return;
        } else if (e.key === "Escape") {
          ac.classList.remove("open");
          return;
        }
        opts.forEach((o, i) => o.classList.toggle("active", i === acIndex));
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".searchbar")) ac.classList.remove("open");
      });

      $("f-marca").addEventListener("change", () => {
        poblarModelos();
        aplicar();
      });

      ["f-modelo", "f-provincia", "sort"].forEach((id) =>
        $(id).addEventListener("change", aplicar)
      );

      [
        "f-precio-min",
        "f-precio-max",
        "f-km-max",
        "f-anio-min",
        "f-anio-max",
      ].forEach((id) => $(id).addEventListener("input", () => debounced(aplicar)));

      document.querySelectorAll("#f-portal input").forEach((c) =>
        c.addEventListener("change", aplicar)
      );

      $("f-tipo").addEventListener("click", (e) => {
        const pill = e.target.closest(".pill");
        if (!pill) return;
        const t = pill.dataset.tipo;
        if (tiposActivos.has(t)) tiposActivos.delete(t);
        else tiposActivos.add(t);
        pill.classList.toggle("on");
        aplicar();
      });

      $("clearFilters").addEventListener("click", () => {
        $("q").value = "";
        $("f-marca").value = "";
        poblarModelos();
        $("f-modelo").value = "";
        $("f-precio-min").value = "";
        $("f-precio-max").value = "";
        $("f-km-max").value = "";
        $("f-anio-min").value = "";
        $("f-anio-max").value = "";
        $("f-provincia").value = "";
        tiposActivos.clear();
        document
          .querySelectorAll("#f-tipo .pill")
          .forEach((p) => p.classList.remove("on"));
        document
          .querySelectorAll("#f-portal input")
          .forEach((c) => (c.checked = true));
        $("sort").value = "recientes";
        aplicar();
      });

      $("loadmore").addEventListener("click", () => {
        visibles += PAGE_SIZE;
        render();
      });

      $("filterToggle").addEventListener("click", () =>
        $("filters").classList.toggle("open")
      );

      /* ───────────────────────── carga inicial ───────────────────────── */
      async function init() {
        skeletons();

        if (firebaseConfig.projectId === "TU_PROYECTO") {
          grid.innerHTML = "";
          showState(
            "🛠️",
            "Configura Firebase",
            'Edita el objeto <code>firebaseConfig</code> al final de <code>index.html</code> con los datos de tu app web de Firebase para empezar a ver anuncios.'
          );
          return;
        }

        try {
          const app = initializeApp(firebaseConfig);
          const db = getFirestore(app);
          const q = query(
            collection(db, "listings"),
            where("activo", "==", true),
            orderBy("fecha_crawl", "desc"),
            limit(FETCH_LIMIT)
          );
          const snap = await getDocs(q);
          TODOS = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

          if (TODOS.length === 0) {
            grid.innerHTML = "";
            showState(
              "🏍️",
              "Aún no hay anuncios",
              "El crawler todavía no ha guardado motos en Firestore. Ejecuta <code>node crawler/index.js</code> y vuelve a cargar."
            );
            return;
          }

          poblarSelects();
          poblarModelos();
          aplicar();
        } catch (e) {
          console.error(e);
          grid.innerHTML = "";
          showState(
            "⚠️",
            "Error al cargar los anuncios",
            "Revisa la consola del navegador. Posibles causas: configuración de Firebase incorrecta, reglas de Firestore o falta el índice (activo + fecha_crawl)."
          );
        }
      }

      init();
    </script>
  </body>
</html>
