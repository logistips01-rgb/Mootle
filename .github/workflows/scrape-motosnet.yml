name: scrape-motosnet

# Lee SOLO motos.net, 4 páginas, cada hora. Así su catálogo entra poco a poco (~96
# páginas/día) sin un golpe fuerte y sin leer de más las webs de los concesionarios,
# que las refresca el workflow diario (scrape.yml). Comparten el mismo grupo de
# concurrencia, así que nunca se pisan. Si motos.net devuelve su página anti-bot, el
# lector se para solo esa vez.

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, en el minuto 17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape-motosnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer motos.net (4 páginas)
        run: python -m scraper.run --only motosnet --minutes 10

      - name: Commit de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ m/ marca/ sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "data: motos.net $(TZ=Europe/Madrid date '+%F %H:%M')"
          for attempt in 1 2 3 4 5; do
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rechazado, reintento $attempt"; sleep $((attempt * 5))
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
