name: scrape-motosnet

# Lee SOLO motos.net, 4 páginas, cada hora. Así su catálogo entra poco a poco (~96
# páginas/día) sin un golpe fuerte y sin leer de más las webs de los concesionarios,
# que las refresca el workflow diario (scrape.yml). Comparten el mismo grupo de
# concurrencia, así que nunca se pisan. Si motos.net devuelve su página anti-bot, el
# lector se para solo esa vez.

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, en el minuto 17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape-motosnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Cada hora: motos.net (novedades). Dos veces al día (06 y 18 UTC): pasada COMPLETA que
      # también refresca los concesionarios, porque el cron diario de scrape.yml no dispara fiable
      # y las webs de concesionario caducaban sin refrescarse (se caían fuentes: ByMotors, Indalmar…).
      # El barrido profundo de motos.net está en pausa por config (cursor parado), así que una
      # pasada completa no lo reactiva: solo lee novedades de motos.net + todos los concesionarios.
      # OJO: GitHub estrangula los cron de este repo y este workflow "horario" solo dispara ~3-4
      # veces/día a horas aleatorias, así que NO sirve fijar franjas horarias. Igual que la
      # equipación: hacemos una pasada COMPLETA (motos.net novedades + TODOS los concesionarios)
      # en la 1ª ejecución de cada día (marcador data/.dealers_last); el resto, solo novedades.
      # Así los concesionarios se refrescan a diario y no se caen por caducidad.
      - name: Leer motos.net (novedades) + concesionarios (1ª del día)
        run: |
          HOY=$(date -u +%F)
          LAST=$(cat data/.dealers_last 2>/dev/null || echo "")
          if [ "$LAST" != "$HOY" ]; then
            echo "Pasada completa (última: ${LAST:-nunca})"
            python -m scraper.run --minutes 10
            echo "$HOY" > data/.dealers_last
          else
            echo "Concesionarios ya refrescados hoy ($LAST); solo novedades motos.net"
            python -m scraper.run --only motosnet --minutes 10
          fi

      # La EQUIPACIÓN es el negocio (afiliados), así que se prioriza su frescura: se refresca
      # varias veces al día colgado del cron horario (el único fiable; los cron diarios de GitHub
      # disparan tarde o no disparan). Corre en 4 franjas (04/10/16/22 UTC, cada 6 h) y además
      # siempre que equipacion.json no sea de hoy (para ponerse al día cuanto antes). No necesita
      # Playwright (lee Shopify/TradeDoubler por HTTP y mezcla el seed de Albabike + ofertas eBay).
      - name: Refrescar equipación (varias veces/día)
        env:
          TRADEDOUBLER_PRODUCTS_TOKEN: ${{ secrets.TRADEDOUBLER_PRODUCTS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETS: ${{ vars.EBAY_MARKETS }}
        run: |
          H=$(date -u +%H); HOY=$(date -u +%F)
          UPD=$(python -c "import json;print(json.load(open('data/equipacion.json')).get('updated',''))" 2>/dev/null || echo "")
          case "$H" in 04|10|16|22) SLOT=1;; *) SLOT=0;; esac
          if [ "$SLOT" = "1" ] || [ "$UPD" != "$HOY" ]; then
            echo "Refrescando equipación (franja=$SLOT, última=$UPD)…"
            python -m scraper.equip
          else
            echo "Hora $H sin franja y equipación ya de hoy ($UPD): no se refresca."
          fi

      - name: Commit de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ m/ marca/ equipacion/ sitemap.xml sitemap-equipacion.xml robots.txt
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "data: motos.net $(TZ=Europe/Madrid date '+%F %H:%M')"
          for attempt in 1 2 3 4 5; do
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rechazado, reintento $attempt"; sleep $((attempt * 5))
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
