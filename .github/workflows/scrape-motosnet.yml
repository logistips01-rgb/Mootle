name: scrape-motosnet

# Lee SOLO motos.net, 4 páginas, cada hora. Así su catálogo entra poco a poco (~96
# páginas/día) sin un golpe fuerte y sin leer de más las webs de los concesionarios,
# que las refresca el workflow diario (scrape.yml). Comparten el mismo grupo de
# concurrencia, así que nunca se pisan. Si motos.net devuelve su página anti-bot, el
# lector se para solo esa vez.

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, en el minuto 17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape-motosnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer motos.net (10 páginas, foco novedades)
        run: python -m scraper.run --only motosnet --minutes 10

      # Refresco de equipación 1×/día colgado del cron horario (que SÍ es fiable), porque los
      # cron diarios de GitHub (scrape/scrape-ebay/albabike) disparan tarde o no disparan. Solo
      # corre si equipacion.json no es de hoy (UTC), así es una vez al día. No necesita Playwright
      # (lee Shopify/TradeDoubler por HTTP y mezcla el seed de Albabike + ofertas eBay ya guardadas).
      - name: Refrescar equipación (1×/día)
        env:
          TRADEDOUBLER_PRODUCTS_TOKEN: ${{ secrets.TRADEDOUBLER_PRODUCTS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETS: ${{ vars.EBAY_MARKETS }}
        run: |
          HOY=$(date -u +%F)
          UPD=$(python -c "import json;print(json.load(open('data/equipacion.json')).get('updated',''))" 2>/dev/null || echo "")
          if [ "$UPD" != "$HOY" ]; then
            echo "Equipación de $UPD (!= hoy $HOY): refrescando precios…"
            python -m scraper.equip
          else
            echo "Equipación ya al día ($UPD), no se refresca."
          fi

      - name: Commit de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ m/ marca/ equipacion/ sitemap.xml sitemap-equipacion.xml robots.txt
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "data: motos.net $(TZ=Europe/Madrid date '+%F %H:%M')"
          for attempt in 1 2 3 4 5; do
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rechazado, reintento $attempt"; sleep $((attempt * 5))
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
