<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--o:#e8590c;--ink:#16150f;--mut:#716d60;--bg:#faf9f6;--soft:#fdf0e7;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1080px;}
  .slide{width:1080px;height:1080px;display:flex;flex-direction:column;padding:96px 90px;position:relative;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;overflow:hidden;}
  .slide.orange{background:var(--o);color:#fff;}
  .slide.ink{background:#16150f;color:#fff;}
  .kick{font-family:"Inter Tight";font-weight:800;font-size:30px;letter-spacing:.08em;text-transform:uppercase;color:var(--o);}
  .orange .kick{color:#ffe3cf;} .ink .kick{color:var(--o);}
  h1{font-family:"Inter Tight";font-weight:900;letter-spacing:-.03em;line-height:1.02;font-size:92px;margin-top:22px;}
  h1 em{font-style:normal;color:var(--o);} .orange h1 em{color:#fff;text-decoration:underline;text-decoration-thickness:8px;text-underline-offset:10px;}
  p.sub{font-size:40px;line-height:1.3;color:var(--mut);margin-top:30px;font-weight:500;max-width:14ch;}
  .orange p.sub,.ink p.sub{color:rgba(255,255,255,.9);}
  .spacer{flex:1;}
  .ico{width:150px;height:150px;color:var(--o);margin-bottom:10px;}
  .orange .ico,.ink .ico{color:#fff;}
  
  .foot{position:relative;z-index:2;display:flex;align-items:center;gap:14px;font-family:"Inter Tight";font-weight:800;font-size:34px;letter-spacing:-.03em;}
  .wheels{display:inline-flex;align-items:center;}
  .wheels svg{width:70px;height:40px;}
  .wheels svg circle{stroke:var(--o);} .wheels svg circle.h{fill:var(--o);stroke:none;}
  .orange .wheels svg circle,.ink .wheels svg circle{stroke:#fff;} .orange .wheels svg circle.h,.ink .wheels svg circle.h{fill:#fff;}
  .url{margin-left:auto;font-size:30px;color:var(--mut);} .orange .url,.ink .url{color:rgba(255,255,255,.85);}
  .big-num{font-family:"Inter Tight";font-weight:900;font-size:250px;line-height:1;color:var(--soft);position:absolute;right:70px;bottom:150px;z-index:0;}
  .orange .big-num{color:rgba(255,255,255,.12);}
  .mark{width:260px;height:260px;border-radius:22%;background:var(--o);display:flex;align-items:center;justify-content:center;margin:0 auto;}
  .mark svg{width:62%;height:62%;} .mark svg circle{stroke:#fff;} .mark svg circle.h{fill:#fff;stroke:none;}
  .center{align-items:center;text-align:center;justify-content:center;}
  .center h1{font-size:104px;} .center p.sub{max-width:20ch;}
  .pill{display:inline-block;background:var(--o);color:#fff;font-family:"Inter Tight";font-weight:800;font-size:40px;padding:22px 44px;border-radius:999px;margin-top:40px;}
  .orange .pill{background:#fff;color:var(--o);}
</style></head>
<body><div id="root"></div>
<script>
const WH='<span class="wheels"><svg viewBox="0 0 92 48"><circle cx="22" cy="26" r="16" fill="none" stroke-width="8"/><circle cx="70" cy="26" r="16" fill="none" stroke-width="8"/><circle class="h" cx="22" cy="26" r="4"/><circle class="h" cx="70" cy="26" r="4"/></svg></span>';
const FOOT='<div class="foot">m'+WH+'tle<span class="url">mootle.es</span></div>';
const I={
 search:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
 stack:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
 tag:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4L13 21l-9-9V4h8l8.6 8.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor"/></svg>',
 chart:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>',
 down:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg>',
 helmet:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a8 8 0 1116 0v2H4z"/><path d="M4 16h11"/></svg>',
};
const SLIDES=[
 {cls:'slide orange center',html:'<div class="mark"><svg viewBox="0 0 92 48"><circle cx="22" cy="26" r="16" fill="none" stroke-width="8"/><circle cx="70" cy="26" r="16" fill="none" stroke-width="8"/><circle class="h" cx="22" cy="26" r="4"/><circle class="h" cx="70" cy="26" r="4"/></svg></div><h1 style="margin-top:50px">Compara motos de ocasión de <em>toda España</em></h1><p class="sub">en un solo sitio · gratis</p><div class="pill">mootle.es</div>'},
 {cls:'slide',html:'<span class="kick">El problema</span><h1>La misma moto está en <em>10 webs</em> distintas…</h1><p class="sub">y a precios distintos. ¿Quién las mira todas?</p><div class="spacer"></div>'+FOOT+'<div class="big-num">01</div>'},
 {cls:'slide',html:'<span class="kick">La solución</span>'+I.search+'<h1>Buscas <em>una vez</em></h1><p class="sub">y te juntamos la misma moto de todos los concesionarios.</p><div class="spacer"></div>'+FOOT+'<div class="big-num">02</div>'},
 {cls:'slide',html:'<span class="kick">Lo que ves</span>'+I.stack+'<h1>La <em>más barata</em>, de un vistazo</h1><p class="sub">precio, km, color y enlace directo al anuncio.</p><div class="spacer"></div>'+FOOT+'<div class="big-num">03</div>'},
 {cls:'slide ink',html:'<span class="kick">Histórico</span>'+I.chart+'<h1>¿Está cara o es <em>chollo</em>?</h1><p class="sub">Vemos el precio día a día para que lo sepas.</p><div class="spacer"></div>'+FOOT+'<div class="big-num">04</div>'},
 {cls:'slide',html:'<span class="kick">Chollos de hoy</span>'+I.down+'<h1>Motos que <em>acaban de bajar</em> de precio</h1><p class="sub">la lista cambia cada día.</p><div class="spacer"></div>'+FOOT+'<div class="big-num">05</div>'},
 {cls:'slide',html:'<span class="kick">No solo motos</span>'+I.helmet+'<h1>También <em>equipación</em></h1><p class="sub">cascos, guantes, chaquetas… comparados entre tiendas.</p><div class="spacer"></div>'+FOOT+'<div class="big-num">06</div>'},
 {cls:'slide orange center',html:'<h1>Encuentra tu moto<br>en <em>mootle.es</em></h1><p class="sub">Gratis. Sin registro.</p><div class="pill">Entra ya →</div><div class="spacer" style="max-height:60px"></div>'+FOOT},
];
const s=new URLSearchParams(location.search), i=+(s.get('i')||0);
const sl=SLIDES[i]; document.getElementById('root').outerHTML='<div class="'+sl.cls+'">'+sl.html+'</div>';
document.title='slide '+i+' of '+SLIDES.length;
</script></body></html>
