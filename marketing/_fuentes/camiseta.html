<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--o:#e8590c;--red:#c1121f;--ink:#16150f;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1200px;height:1400px;}
  body{display:flex;align-items:center;justify-content:center;font-family:"Inter Tight",sans-serif;background:#ffffff;}
  body.dark{background:#17171a;} body.red{background:#9c1420;} body.print{background:transparent;}
  .design{display:flex;flex-direction:column;align-items:center;gap:30px;--fg:var(--ink);color:var(--fg);}
  body.dark .design,body.red .design{--fg:#fff;}
  /* logo con ruedas */
  .wordwrap{position:relative;}
  .hat{position:absolute;top:-78px;left:-54px;width:200px;height:150px;transform:rotate(-16deg);}
  .word{display:inline-flex;align-items:center;font-weight:900;letter-spacing:-.05em;line-height:1;font-size:210px;}
  .word svg.wheels{width:1.53em;height:.8em;margin:0 .02em;position:relative;top:.06em;}
  .word svg.wheels circle{stroke:var(--o);stroke-width:8;}
  .word svg.wheels circle.hub{fill:var(--o);stroke:none;}
  body.dark .word svg.wheels circle, body.red .word svg.wheels circle{stroke:var(--o);}
  .ribbon{font-family:Inter;font-weight:800;font-size:60px;letter-spacing:.02em;text-transform:uppercase;
          background:var(--ribbon,var(--red));color:#fff;padding:16px 42px;border-radius:16px;transform:rotate(-1.5deg);
          box-shadow:0 10px 0 rgba(0,0,0,.12);}
  body.dark .ribbon,body.red .ribbon{box-shadow:0 10px 0 rgba(0,0,0,.3);}
  .sub{font-family:Inter;font-weight:700;font-size:40px;letter-spacing:.06em;text-transform:uppercase;opacity:.9;}
  .url{font-family:Inter;font-weight:800;font-size:46px;color:var(--o);letter-spacing:-.01em;margin-top:4px;}
  /* copos */
  .snow{position:absolute;width:100%;height:100%;top:0;left:0;pointer-events:none;}
  .snow span{position:absolute;color:var(--fg);opacity:.14;font-size:46px;}
</style></head>
<body>
<div class="design" id="design">
  <div class="wordwrap">
    <svg class="hat" viewBox="0 0 200 150" aria-hidden="true">
      <path class="hatbody" d="M18 120 C40 40 150 20 184 92 C150 78 70 88 44 122 Z" fill="#c1121f"/>
      <rect x="10" y="112" width="150" height="34" rx="17" fill="#fff"/>
      <circle cx="186" cy="92" r="22" fill="#fff"/>
    </svg>
    <div class="word">m<svg class="wheels" viewBox="0 0 92 48" aria-hidden="true"><circle cx="22" cy="26" r="16" fill="none"/><circle cx="70" cy="26" r="16" fill="none"/><circle class="hub" cx="22" cy="26" r="4"/><circle class="hub" cx="70" cy="26" r="4"/></svg>tle</div>
  </div>
  <div class="ribbon" id="ribbon">Rodada de Papá Noel</div>
  <div class="sub" id="sub">Comparador de motos y equipación</div>
  <div class="url">mootle.es</div>
</div>
<script>
  var q=new URLSearchParams(location.search);
  if(q.get('bg')) document.body.classList.add(q.get('bg'));
  if(q.get('print')) document.body.classList.add('print');
  if(q.get('ribbon')) document.getElementById('ribbon').textContent=q.get('ribbon');
  if(q.get('sub')) document.getElementById('sub').textContent=q.get('sub');
  if(q.get('hat')==='orange'){
    document.querySelector('.hatbody').setAttribute('fill','#e8590c');
    document.documentElement.style.setProperty('--ribbon','#16150f');
  }
  if(q.get('hat')==='none') document.querySelector('.hat').style.display='none';
  if(q.get('ribbon')==='none') document.getElementById('ribbon').style.display='none';
  window.__ready=true;
</script></body></html>
